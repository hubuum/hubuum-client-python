[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hubuum-client"
version = "0.0.1"
description = "Modern typed Python client for Hubuum server v0.0.3"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hubuum contributors" }]
keywords = ["hubuum", "api", "client", "async", "cmdb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/hubuum/hubuum-client-python"
Documentation = "https://github.com/hubuum/hubuum-client-python/tree/main/docs"
Issues = "https://github.com/hubuum/hubuum-client-python/issues"
Repository = "https://github.com/hubuum/hubuum-client-python"

[project.optional-dependencies]
docs = [
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.27,<1",
]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
]
dev = [
  "bandit>=1.9.4,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "zizmor>=1.27,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hubuum_client"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests/unit"]
asyncio_mode = "auto"
markers = ["e2e: requires a live Hubuum v0.0.3 server"]

[tool.coverage.run]
branch = true
source = ["hubuum_client"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "PT", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR0911", "PLR0912", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests/unit"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["respx"]
ignore_missing_imports = true

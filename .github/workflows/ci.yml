name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, project/auth-support]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  UV_FROZEN: "1"
  HUBUUM_TARGET_SERVER_VERSION: "0.0.22"
  HUBUUM_TARGET_SERVER_IMAGE: ghcr.io/hubuum/hubuum-server:v0.0.22@sha256:71ff4090eac071f23ae59f7265dc07165939d42771a73d1d291defa023b4964b

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.policy.outputs.code }}
      markdown: ${{ steps.policy.outputs.markdown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Test CI selection and gate
        run: python3 scripts/test-ci-policy.py
      - name: Classify changes
        id: policy
        run: python3 scripts/ci-policy.py

  markdown:
    name: Markdown lint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: '.markdownlint.json'
          globs: '**/*.md'

  quality:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Application quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python scripts/generate-typed-api.py --check
      - run: uv run mypy
      - run: uv run bandit -q -r src scripts
      - run: uv run zizmor .
      - run: uv run mkdocs build --strict
      - run: uv build


      - name: Prepare authentication candidate
        if: github.ref == 'refs/heads/project/auth-support' || github.base_ref == 'project/auth-support'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/auth-candidate"
          cp dist/*.whl dist/*.tar.gz "$RUNNER_TEMP/auth-candidate/"
          git archive --format=tar.gz --output="$RUNNER_TEMP/auth-candidate/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/auth-candidate/TESTED_COMMIT"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/auth-candidate/SOURCE_COMMIT"
          printf '%s/actions/runs/%s/attempts/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/auth-candidate/WORKFLOW_RUN"
          (cd "$RUNNER_TEMP/auth-candidate" && sha256sum ./* > SHA256SUMS)
      - name: Retain authentication candidate
        if: github.ref == 'refs/heads/project/auth-support' || github.base_ref == 'project/auth-support'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auth-candidate/
          if-no-files-found: error
          retention-days: 30

  test:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra test
      - run: uv run pytest --cov=hubuum_client

  server-contract:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Hubuum v0.0.22 OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python scripts/check-openapi-contract.py

  e2e:
    if: needs.changes.outputs.code == 'true'
    name: Pinned Hubuum v0.0.22 e2e
    runs-on: ubuntu-latest
    needs: [changes, quality, test, server-contract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build wheel and run pinned live-server suite
        run: ./scripts/run-e2e-tests.sh
        env:
          HUBUUM_E2E_SERVER_IMAGE: ${{ env.HUBUUM_TARGET_SERVER_IMAGE }}

  ci-gate:
    # Preserve the existing required check name while aggregating every CI job.
    name: Lint, types, docs, and package
    if: always()
    needs: [changes, markdown, quality, test, server-contract, e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Require every selected check to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CODE_JOBS: quality test server-contract e2e
        run: python3 scripts/ci-policy.py --gate

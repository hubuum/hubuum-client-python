site_name: Hubuum Client for Python
site_description: Typed synchronous and asynchronous Python client for Hubuum server v0.0.9
site_url: https://hubuum.github.io/hubuum-client-python/
repo_url: https://github.com/hubuum/hubuum-client-python
repo_name: hubuum/hubuum-client-python
copyright: Copyright &copy; 2026 Hubuum contributors

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            separate_signature: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Client setup: client.md
  - Querying and pagination: querying.md
  - Advanced usage: advanced.md
  - API reference: api.md
  - Server compatibility: compatibility.md
  - End-to-end tests: e2e.md
  - Releasing: releasing.md
  - Changelog: changelog.md

strict: true
